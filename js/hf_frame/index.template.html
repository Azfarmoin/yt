<!doctype html>

<div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="1080" data-height="1920">

      <g transform="translate(1046 1886) scale(-1 -1)"><path d="M0 120 L0 0 L120 0 M24 24 L24 80 M24 24 L80 24 M0 0 L56 56" pathLength="1" stroke-dasharray="1"/></g>
    </g>

  </svg>
</div>
<script>
  window.__timelines = window.__timelines || {};
  const D = __DUR__, tl = gsap.timeline({ paused: true });

  const spots = [[540, 34], [540, 1886], [34, 960], [1046, 960]];

    const p = document.createElementNS(NS, "polygon"); let pts = [];

    p.setAttribute("points", pts.join(" ")); p.setAttribute("fill", "__COLOR__"); p.setAttribute("fill-opacity", "0.25"); g.appendChild(p); stars.appendChild(g);
